[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "fast-flights-opinionated"
version = "0.1.0"
description = "An unofficial, extended version of the fast, robust, strongly-typed Google Flights scraper (API) implemented in Python."
keywords = ["flights", "google", "google-flights", "scraper", "protobuf", "travel", "trip", "passengers", "airport"]
authors = [
  { name = "abhinavm24", email = "am13@iitbbs.ac.in" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  "primp",
  "protobuf>=5.27.0",
  "selectolax",
  "rjsonc"
]

[project.scripts]
flights-cli = "fast_flights_opinionated.cli:main"

[project.optional-dependencies]
local = [
    "playwright"
]

[project.urls]
"Source" = "https://github.com/abhinavm24/flights"
"Issues" = "https://github.com/abhinavm24/flights/issues"
"Documentation" = "https://github.com/abhinavm24/flights/README.md"
"Original Source" = "https://github.com/AWeirdDev/flights"

[tool.setuptools]
packages = [
    "fast_flights"
]

[tool.pyright]
pythonVersion = '3.9'

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pip>=25.0.1",
    "pytest>=8.0.0",
]
